<template id="dc-page">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
body{margin:0;background:#1f2622}
a{color:#121513;text-decoration:none}a:hover{color:#000000}
</style>
</helmet>
<div style="background: #b3b9b4; color: #121513; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.6">

<dc-import name="Header" current="contact" hint-size="100%,70px"></dc-import>

<section style="background-color: #1f2622; background-image: linear-gradient(rgba(236,235,226,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(236,235,226,0.045) 1px, transparent 1px); background-size: 48px 48px; color: #ecebe2">
<div style="max-width: 1180px; margin: 0 auto; padding: clamp(48px, 7vw, 100px) clamp(20px, 4vw, 48px) clamp(56px, 7vw, 96px)">
<p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #7fc4c2">CONTACT</p>
<h1 style="margin: 20px 0 0; font-family: 'Archivo', sans-serif; font-stretch: 108%; font-weight: 600; font-size: clamp(2.6rem, 6.4vw, 5.6rem); line-height: 0.96; letter-spacing: -0.035em">Start with a conversation.</h1>
<p style="margin: 26px 0 0; max-width: 560px; font-size: clamp(1.05rem, 1.5vw, 1.22rem); line-height: 1.55; color: #c8ccc4">Questions about a fund, a gift or a program. We'll get back to you as soon as we can.</p>
</div>
</section>

<section style="max-width: 1180px; margin: 0 auto; padding: clamp(64px, 8vw, 104px) clamp(20px, 4vw, 48px); display: flex; flex-wrap: wrap; gap: 40px 56px">
<form style="flex: 3 1 460px; display: flex; flex-direction: column; gap: 18px; padding: clamp(22px, 3vw, 34px); border: 1.5px solid #121513; background: #d3d7d3; box-shadow: 6px 6px 0 #121513">
<div style="display: flex; flex-wrap: wrap; gap: 18px">
<label style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em">YOUR NAME *<input type="text" required style="min-height: 46px; padding: 0 12px; border: 1.5px solid #121513; border-radius: 5px; background: #ecebe2; font-family: 'IBM Plex Sans', sans-serif; font-size: 16px; color: #121513"></label>
<label style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em">YOUR EMAIL *<input type="email" required style="min-height: 46px; padding: 0 12px; border: 1.5px solid #121513; border-radius: 5px; background: #ecebe2; font-family: 'IBM Plex Sans', sans-serif; font-size: 16px; color: #121513"></label>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em">I'M ASKING ABOUT
<select style="min-height: 46px; padding: 0 10px; border: 1.5px solid #121513; border-radius: 5px; background: #ecebe2; font-family: 'IBM Plex Sans', sans-serif; font-size: 16px; color: #121513">
<option>Donor-advised funds</option>
<option>Fiscal sponsorship</option>
<option>Complex giving</option>
<option>Split-interest giving</option>
<option>Premium financed giving</option>
<option>Joining the Legacy Family</option>
<option>Something else</option>
</select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em">SUBJECT *<input type="text" required style="min-height: 46px; padding: 0 12px; border: 1.5px solid #121513; border-radius: 5px; background: #ecebe2; font-family: 'IBM Plex Sans', sans-serif; font-size: 16px; color: #121513"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em">MESSAGE<textarea rows="6" style="padding: 12px; border: 1.5px solid #121513; border-radius: 5px; background: #ecebe2; font-family: 'IBM Plex Sans', sans-serif; font-size: 16px; color: #121513; resize: vertical"></textarea></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em">ATTACHMENT<input type="file" style="font-family: 'IBM Plex Sans', sans-serif; font-size: 14px"></label>
<button type="button" style="align-self: flex-start; min-height: 52px; padding: 0 26px; border: 0; border-radius: 6px; background: #b23a30; color: #ffffff; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.3); cursor: pointer">SEND MESSAGE</button>
</form>
<aside style="flex: 2 1 300px; display: flex; flex-direction: column; gap: 22px">
<div style="padding: 24px 22px; border-radius: 8px; background: #1f2622; color: #ecebe2">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #7fc4c2">DIRECT LINES</div>
<a href="tel:+16027041000" style="display: flex; align-items: center; min-height: 44px; margin-top: 8px; font-family: 'Archivo', sans-serif; font-stretch: 106%; font-weight: 600; font-size: 1.4rem; color: #ecebe2">+1 602-704-1000</a>
<a href="mailto:info@legacyglobal.org" style="display: flex; align-items: center; min-height: 44px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #ecebe2">info@legacyglobal.org</a>
<p style="margin: 14px 0 0; font-size: 14px; color: #c8ccc4">[OFFICE ADDRESS]<br>[OFFICE HOURS]</p>
</div>
<div style="padding: 24px 22px; border: 1.5px solid #121513; background: #c9cec9; box-shadow: 6px 6px 0 #121513">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #164a4c">ALREADY A CLIENT</div>
<p style="margin: 10px 0 0; font-size: 15px; color: #2e3330">Grants, statements, invoices and other requests go fastest through the Gateway.</p>
<a href="gateway.html" style="display: inline-flex; align-items: center; min-height: 46px; margin-top: 14px; padding: 0 18px; border-radius: 6px; background: #2A7173; color: #ffffff; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.28)">OPEN THE GATEWAY</a>
</div>
</aside>
</section>

<dc-import name="Footer" hint-size="100%,380px"></dc-import>

</div>

return {
links: items.map((i) => ({
...i,
style: base + (i.key === current

: 'color: #bfc5bb')
}))
};
}
}
</script>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Legacy Gateway | Legacy Global</title>
<meta name="description" content="Requests for donors, fund advisors and charitable programs.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style id="dc-cloak">body{visibility:hidden;background:#1f2622}</style>

<body>
<template id="dc-page">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
body{margin:0;background:#1f2622}
a{color:#121513;text-decoration:none}a:hover{color:#000000}
</style>
</helmet>
<div style="background: #b3b9b4; color: #121513; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.6">

<dc-import name="Header" current="gateway" hint-size="100%,70px"></dc-import>

<section style="background-color: #1f2622; background-image: linear-gradient(rgba(236,235,226,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(236,235,226,0.045) 1px, transparent 1px); background-size: 48px 48px; color: #ecebe2">
<div style="max-width: 1180px; margin: 0 auto; padding: clamp(48px, 7vw, 100px) clamp(20px, 4vw, 48px) clamp(56px, 7vw, 96px); display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 32px 48px">
<div style="flex: 1 1 520px">
<p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #7fc4c2">FOR DONORS, ADVISORS AND PROGRAMS</p>
<h1 style="margin: 20px 0 0; font-family: 'Archivo', sans-serif; font-stretch: 108%; font-weight: 600; font-size: clamp(2.6rem, 6.4vw, 5.6rem); line-height: 0.96; letter-spacing: -0.035em">The Legacy Gateway</h1>
<p style="margin: 26px 0 0; max-width: 560px; font-size: clamp(1.05rem, 1.5vw, 1.22rem); line-height: 1.55; color: #c8ccc4">Common requests, in one place. Pick a key, fill in the form, and our team takes it from there.</p>
</div>
<a href="#" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 22px; border-radius: 6px; background: #c9cec9; color: #121513; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.18)">LOG IN TO YOUR PORTAL</a>
</div>
</section>

<section style="max-width: 1180px; margin: 0 auto; padding: clamp(64px, 8vw, 112px) clamp(20px, 4vw, 48px)">
<div style="display: flex; align-items: center; gap: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.12em"><span style="color: #164a4c">01</span><span>REQUESTS</span><span aria-hidden="true" style="flex: 1; height: 1px; background: #121513"></span></div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; margin-top: 32px">
<sc-for list="{{requests}}" as="r" hint-placeholder-count="8">
<div style="display: flex; flex-direction: column; gap: 12px; padding: 20px 20px 18px; border: 1.5px solid #121513; background: #d3d7d3; box-shadow: 6px 6px 0 #121513">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 38px; padding: 0 8px; border-radius: 6px; background: #343a37; color: #ecebe2; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.35)">{{r.key}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #2e3330">{{r.who}}</span>
</div>
<h2 style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 106%; font-weight: 600; font-size: 1.3rem; letter-spacing: -0.02em">{{r.t}}</h2>
<p style="margin: 0; flex-grow: 1; font-size: 15px; color: #2e3330">{{r.d}}</p>
<a href="#" style="display: inline-flex; align-items: center; justify-content: space-between; min-height: 46px; padding: 0 14px; border-radius: 6px; background: #2A7173; color: #ffffff; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.28)">{{r.cta}} <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8h10M9 4l4 4-4 4"></path></svg></a>
</div>
</sc-for>
</div>
</section>

<section style="background: #1f2622; color: #ecebe2">
<div style="max-width: 1180px; margin: 0 auto; padding: clamp(64px, 8vw, 104px) clamp(20px, 4vw, 48px); display: flex; flex-wrap: wrap; gap: 22px">
<div style="flex: 1 1 340px; padding: 26px 24px; border: 1px solid #4a554e; border-radius: 8px; background: #26302b">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #7fc4c2">BEFORE YOU SUBMIT</div>
<ul style="margin: 14px 0 0; padding-left: 20px; font-size: 15px; line-height: 1.7; color: #c8ccc4">
<li>Include your fund or program name on every request.</li>
<li>Grant, investment and statement requests need advisory privileges on the fund.</li>
<li>Invoices and reimbursements must relate to the fund's charitable mission.</li>
<li>Attach receipts and supporting documents where they apply.</li>
</ul>
</div>
<div style="flex: 1 1 340px; padding: 26px 24px; border-radius: 8px; background: #c9cec9; color: #121513; box-shadow: inset 0 -6px 0 rgba(0,0,0,0.16)">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #164a4c">NEW COHORT MEMBER OR ADVISOR</div>
<h2 style="margin: 10px 0 0; font-family: 'Archivo', sans-serif; font-stretch: 106%; font-weight: 600; font-size: 1.45rem; letter-spacing: -0.02em">Apply to join a fund or program</h2>
<p style="margin: 10px 0 0; font-size: 15px; color: #2e3330">We vet every potential cohort member and advisor for compliance. You'll need a current government-issued photo ID.</p>
<a href="#" style="display: inline-flex; align-items: center; min-height: 46px; margin-top: 16px; padding: 0 18px; border-radius: 6px; background: #343a37; color: #ecebe2; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.35)">START AN APPLICATION</a>
</div>
</div>
</section>

<dc-import name="Footer" hint-size="100%,380px"></dc-import>

</div>
</template>
<script type="text/x-dc" data-for="page" data-props='{"$preview":{"width":1440,"height":4200}}'>
class Component extends DCLogic {
renderVals() {
return {
requests: [
{ key: 'DON', who: 'DONORS', t: 'Donation notification', d: 'Tell us about a scheduled direct donation by check, ACH, wire or securities.', cta: 'NOTIFY US' },
{ key: 'NCD', who: 'DONORS', t: 'Non-cash donation', d: 'Start the review for a gift of real estate, business interests or other non-cash assets.', cta: 'START A REVIEW' },
{ key: 'GRT', who: 'ADVISORS', t: 'Grant request', d: 'Recommend a grant from your fund to a qualified organization or cause.', cta: 'REQUEST A GRANT' },
{ key: 'INV', who: 'ADVISORS', t: 'Investment request', d: 'Invest charitable funds so the returns can support future charitable work.', cta: 'REQUEST AN INVESTMENT' },
{ key: 'STM', who: 'ADVISORS', t: 'Statement request', d: 'Council members and donors with advisory privileges can request a fund statement.', cta: 'REQUEST A STATEMENT' },
{ key: 'INVC', who: 'PROGRAMS', t: 'Submit an invoice', d: 'Pay a contractor who is helping fulfill your program’s charitable mission.', cta: 'SUBMIT AN INVOICE' },
{ key: 'RMB', who: 'PROGRAMS', t: 'Reimbursement request', d: 'Send a cover letter and itemized receipts for qualified charitable expenses.', cta: 'REQUEST REIMBURSEMENT' },
{ key: 'DOC', who: 'ANYONE', t: 'Submit a document', d: 'Send a document for review or processing, with as much detail as you can.', cta: 'SUBMIT A DOCUMENT' }
]
};
}
}
</script>

<script type="text/x-dc" data-for="Header" data-props='{"current":{"editor":"enum","options":["home","services","family","about","gateway","contact"],"default":"home"},"$preview":{"width":1440,"height":70}}'>
class Component extends DCLogic {
renderVals() {
const current = this.props.current ?? 'home';
const base = 'display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; text-decoration: none; ';
const items = [
{ key: 'services', label: 'Services', href: 'services.html' },
{ key: 'family', label: 'The Legacy Family', href: 'legacy-family.html' },
{ key: 'about', label: 'About', href: 'about.html' },
{ key: 'gateway', label: 'Gateway', href: 'gateway.html' },
{ key: 'contact', label: 'Contact', href: 'contact.html' }
];
return {
links: items.map((i) => ({
...i,
style: base + (i.key === current
? 'color: #ecebe2; box-shadow: inset 0 -2px 0 #7fc4c2'
: 'color: #bfc5bb')
}))
};
}
}
</script>
